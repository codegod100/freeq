name: freeq-macos
options:
  bundleIdPrefix: at.freeq
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.4"

targets:
  freeq-macos:
    type: application
    platform: macOS
    sources:
      - path: freeq-macos
        type: group
      - path: Generated/freeq.swift
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.freeq.macos
        PRODUCT_NAME: freeq
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
        INFOPLIST_KEY_CFBundleDisplayName: freeq
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "freeq uses your camera for video calls."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "freeq uses your microphone for voice and video calls."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "freeq uses on-device speech recognition to transcribe voice messages."
        OTHER_LDFLAGS:
          - "-framework"
          - "Security"
          - "-framework"
          - "SystemConfiguration"
          - "-framework"
          - "AuthenticationServices"
          - "-framework"
          - "AVFoundation"
          - "-framework"
          - "AVKit"
          - "-framework"
          - "Speech"
          - "-framework"
          - "AudioToolbox"
          - "-framework"
          - "CoreAudio"
          - "-framework"
          - "CoreMedia"
          - "-framework"
          - "CoreVideo"
          - "-framework"
          - "VideoToolbox"
          - "-framework"
          - "Network"
          - "-lc++"
        CLANG_ENABLE_MODULES: YES
    dependencies:
      # Static archive — link only. Embedding a .a breaks codesign.
      - framework: FreeqSDK.xcframework
        embed: false
    preBuildScripts:
      - name: Check Rust FFI freshness
        script: '"$SRCROOT/scripts/check-ffi-source-fresh.sh"'
        basedOnDependencyAnalysis: false
    entitlements:
      path: freeq-macos/freeq-macos.entitlements
      properties:
        # Phase 1: sandbox ON (ADA/MAS prerequisite; late sandboxing would
        # invalidate everything tested before it).
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # iroh P2P listens for inbound peer connections.
        com.apple.security.network.server: true
        # AV calls + voice messages.
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        # Uploads via open panel / drag-drop; image "Save" via save panel.
        com.apple.security.files.user-selected.read-write: true
