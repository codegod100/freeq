[package]
name = "freeq-webui-client"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
wasm-bindgen-futures = "0.4"
yew = { version = "0.20", features = ["csr"] }
yew-router = "0.17"
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "Node", "EventSource",
    "Request", "RequestInit", "RequestCredentials", "Headers", "Response",
    "MessageEvent", "DomTokenList",
] }
