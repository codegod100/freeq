<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0e1116" />
    <meta name="color-scheme" content="dark" />
    <title>freeq — offline</title>
    <style>
      :root {
        --bg: #0e1116;
        --fg: #d6d6d6;
        --muted: #6b7280;
        --accent: #7ab7ff;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%; margin: 0;
        background: var(--bg); color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        display: grid; place-items: center;
        -webkit-font-smoothing: antialiased;
      }
      main {
        text-align: center; padding: 2rem; max-width: 22rem;
      }
      h1 { font-size: 1.1rem; font-weight: 700; margin: 0 0 .5rem; }
      p { color: var(--muted); font-size: .9rem; line-height: 1.5; margin: 0 0 1.25rem; }
      a {
        display: inline-block; text-decoration: none;
        background: var(--accent); color: #0e1116;
        font-weight: 600; font-size: .875rem;
        padding: .55rem 1rem; border-radius: .5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>freeq needs a network to reach the IRC server. Reconnect and try again.</p>
      <a href="/chat">Retry</a>
    </main>
  </body>
</html>
