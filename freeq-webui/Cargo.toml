[package]
name = "freeq-webui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Topcoat web UI for freeq IRC server (standalone BFF proxy)"

# Standalone package (excluded from freeq workspace: topcoat vs iroh sha2 conflict).
[workspace]

[[bin]]
name = "freeq-webui"
path = "src/main.rs"

[dependencies]
topcoat = { path = "../../topcoat/crates/topcoat", features = [
    "tailwind",
    "runtime",
    "htmx",
    "session",
    "cookie",
    "multipart",
] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
url = "2"
parking_lot = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
sha2 = "0.10"
freeq-sdk = { path = "../freeq-sdk", default-features = false }

[build-dependencies]
topcoat = { path = "../../topcoat/crates/topcoat", default-features = false, features = ["tailwind"] }
