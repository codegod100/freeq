[package]
name = "freeq-webui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "DataStar-based web UI for freeq IRC server (standalone proxy)"

[[bin]]
name = "freeq-webui"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
chrono = "0.4"
datastar = { version = "0.3", features = ["axum"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tera = "2"
async-stream = "0.3"
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
parking_lot = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
bs58 = "0.5"

freeq-sdk = { path = "../freeq-sdk", default-features = false }
