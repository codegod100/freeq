[package]
name = "freeq-webui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Topcoat web UI for freeq IRC server (standalone BFF proxy)"

[[bin]]
name = "freeq-webui"
path = "src/main.rs"

[dependencies]
topcoat = { path = "../../topcoat/crates/topcoat", features = [
    "tailwind",
    "runtime",
    "session",
    "cookie",
    "multipart",
] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "multipart"] }
url = "2"
parking_lot = "0.12"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
async-stream = "0.3"
chrono = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
sha2 = { workspace = true }
freeq-sdk = { path = "../freeq-sdk", default-features = false }

[build-dependencies]
topcoat = { path = "../../topcoat/crates/topcoat", default-features = false, features = ["tailwind"] }
