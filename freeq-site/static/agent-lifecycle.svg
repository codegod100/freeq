<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="SF Mono, Menlo, Consolas, monospace">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#000000"/>
  <text x="480" y="32" fill="#555" font-size="11" text-anchor="middle" letter-spacing="2">AGENT LIFECYCLE — ALL OF IT VISIBLE IN THE CHANNEL</text>

  <g font-size="11.5" text-anchor="middle">
    <rect x="30" y="70" width="150" height="58" rx="7" fill="#16070f" stroke="#f472b6"/>
    <text x="105" y="94" fill="#f472b6" font-weight="bold">1 · mint identity</text>
    <text x="105" y="112" fill="#999" font-size="10">ed25519 → did:key, local</text>

    <rect x="215" y="70" width="150" height="58" rx="7" fill="#0d0d0f" stroke="#2a2a2a"/>
    <text x="290" y="94" fill="#e8e8e8" font-weight="bold">2 · authenticate</text>
    <text x="290" y="112" fill="#999" font-size="10">SASL ATPROTO-CHALLENGE</text>

    <rect x="400" y="70" width="150" height="58" rx="7" fill="#0d0d0f" stroke="#2a2a2a"/>
    <text x="475" y="94" fill="#e8e8e8" font-weight="bold">3 · declare</text>
    <text x="475" y="108" fill="#999" font-size="10">owner DID · provenance</text>
    <text x="475" y="121" fill="#999" font-size="10">manifest · capabilities</text>

    <rect x="585" y="70" width="150" height="58" rx="7" fill="#0d0d0f" stroke="#2a2a2a"/>
    <text x="660" y="94" fill="#e8e8e8" font-weight="bold">4 · work in the open</text>
    <text x="660" y="108" fill="#999" font-size="10">task events + evidence</text>
    <text x="660" y="121" fill="#999" font-size="10">signed msgs · streaming</text>

    <rect x="770" y="70" width="160" height="58" rx="7" fill="#02141a" stroke="#00e5ff"/>
    <text x="850" y="94" fill="#00e5ff" font-weight="bold">5 · governed</text>
    <text x="850" y="108" fill="#999" font-size="10">pause · resume · revoke</text>
    <text x="850" y="121" fill="#999" font-size="10">by owner, from any client</text>
  </g>

  <line x1="180" y1="99" x2="213" y2="99" stroke="#555" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="365" y1="99" x2="398" y2="99" stroke="#555" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="550" y1="99" x2="583" y2="99" stroke="#555" stroke-width="1.5" marker-end="url(#ar2)"/>
  <line x1="735" y1="99" x2="768" y2="99" stroke="#555" stroke-width="1.5" marker-end="url(#ar2)"/>

  <!-- heartbeat strip -->
  <rect x="215" y="180" width="520" height="52" rx="7" fill="#0a0a0c" stroke="#00e5a0" stroke-opacity=".4"/>
  <text x="475" y="202" fill="#00e5a0" font-size="11.5" text-anchor="middle" font-weight="bold">continuous: signed heartbeats</text>
  <text x="475" y="220" fill="#999" font-size="10" text-anchor="middle">online → degraded → offline → disconnected · missed TTL = capabilities lapse · no ghost agents</text>
  <line x1="660" y1="130" x2="530" y2="178" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="850" y1="130" x2="640" y2="178" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="480" y="272" fill="#444" font-size="10.5" text-anchor="middle">a standard IRC client sees all of this as plain, readable text — that is the point</text>
</svg>
