[package]
name = "eve-av-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone freeq AV media plane for eve — controlled over WebSocket"
publish = false

[[bin]]
name = "eve-av-bridge"
path = "src/main.rs"

[dependencies]
freeq-av = { path = "../freeq-av" }
freeq-agent-kit = { path = "../freeq-agent-kit" }
freeq-sdk = { path = "../freeq-sdk", default-features = false, features = ["ring", "rustls-tls"], optional = true }

tokio = { workspace = true }
futures-util = "0.3"
axum = { workspace = true }
tower-http = { workspace = true, features = ["cors", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
url = "2"
iroh-live = { git = "https://github.com/n0-computer/iroh-live", rev = "edd9bcc530a615f3ab3a6919e96790a077905376", default-features = false, features = ["opus", "h264"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
uuid = { version = "1", features = ["v4"] }
bytes = "1"
libc = "0.2"
reqwest = { workspace = true, default-features = false, features = ["rustls-tls", "stream"] }

[features]
default = []
# Own IRC for av-state (do not run with Node irc-bridge as same nick).
irc-signaling = ["dep:freeq-sdk"]

[lints]
workspace = true
