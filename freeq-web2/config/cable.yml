development:
  adapter: async

test:
  adapter: test

production:
  # Single-process Puma on boxd: async is enough. Set REDIS_URL to use Redis.
  adapter: <%= ENV["REDIS_URL"].to_s.empty? ? "async" : "redis" %>
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>
  channel_prefix: freeq_web2_production
